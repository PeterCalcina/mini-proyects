<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0078d7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Windows Security</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/motion.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <!-- ?nombre=Brisa  |  ?nombres=Brisa,Violeta -->
  </head>
  <body>
    <section id="gate" class="gate rise">
      <div class="win">
        <p class="win-bar">Windows Security</p>
        <div class="win-body">
          <h1>Verificación de identidad</h1>
          <p id="gateText"></p>
          <button id="allow" type="button">Permitir acceso</button>
        </div>
      </div>
    </section>

    <section id="panic" class="panic" hidden>
      <p class="sad">:(</p>
      <h2>Se encontró actividad sospechosa en este dispositivo</h2>
      <p id="panicLead"></p>
      <p class="mono" id="code"></p>
      <div class="bar-wrap">
        <div class="bar" id="bar"></div>
      </div>
      <p class="pct" id="pct">0% completado</p>
      <ul class="log" id="log"></ul>
    </section>

    <section id="reveal" class="reveal" hidden>
      <div class="cat" aria-hidden="true">
        <div class="cat-head">
          <i class="ear l"></i><i class="ear r"></i>
          <b class="eye l"></b><b class="eye r"></b>
          <s class="nose"></s>
        </div>
        <div class="cat-body"></div>
      </div>
      <h2 id="revealTitle">¡Caíste!</h2>
      <p id="revealText"></p>
      <button id="again" type="button">Asustarme otra vez</button>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
