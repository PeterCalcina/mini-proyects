<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Termómetro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <!-- ?nombre=Violeta -->
  </head>
  <body data-band="medio">
    <main class="wrap rise">
      <a class="back" id="back" href="../index.html">← El rincón</a>
      <p class="kicker">Recetario de sonrisas</p>
      <h1>¿Cómo te sientes hoy?</h1>
      <p class="lead" id="lead"></p>

      <div class="dial glass">
        <p class="num font-heading" id="num">50</p>
        <p class="band-name" id="bandName">tirando</p>
        <div
          class="slider"
          id="slider"
          role="slider"
          tabindex="0"
          aria-valuemin="1"
          aria-valuemax="100"
          aria-valuenow="50"
          aria-label="Ánimo"
        >
          <span class="track"><i id="mercury"></i></span>
          <b class="thumb" id="thumb"></b>
        </div>
        <p class="scale"><span>Pesado</span><span>Liviano</span></p>
      </div>

      <section id="rx" class="rx glass" hidden></section>
    </main>
    <button id="float" class="float btn" type="button">Reclamar café o abrazo virtual</button>
    <div id="hug" class="hug"></div>
    <script src="js/recetas.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
