<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2140" />
    <meta name="mobile-web-app-capable" content="yes" />

  <body>
    <main class="rise">
      <p class="kicker" id="greet"></p>
      <h1>No tienes que decidirlo todo.</h1>
      <p class="lead">Desliza. Derecha = eso. Izquierda = otra cosa.</p>

      <div class="deck" id="deck"></div>
      <div class="hint" id="hint">← otra &nbsp;&nbsp; eso →</div>
      <div class="btns">
        <button id="no" type="button" aria-label="Otra">Otra</button>
        <button id="yes" type="button" aria-label="Eso">Eso</button>
      </div>
      <section id="done" class="done" hidden></section>
    </main>
    <script src="js/script.js"></script>
  </body>
